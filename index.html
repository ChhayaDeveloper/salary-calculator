<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Salary Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <div class="header">
        <h1>Employee Salary Calculator</h1>
        <p>Calculate your monthly salary easily</p>
    </div>

    <div class="content">

        <div class="form-section">
            <h2>Employee Details</h2>

            <label>Employee Name</label>
            <input type="text" id="name" placeholder="Enter employee name">

            <label>Employee ID</label>
            <input type="text" id="empId" placeholder="Enter employee ID">

            <label>Basic Salary (₹)</label>
            <input type="number" id="basic" placeholder="Enter basic salary">

            <label>HRA (₹)</label>
            <input type="number" id="hra" placeholder="Enter HRA">

            <label>Allowances (₹)</label>
            <input type="number" id="allowance" placeholder="Enter allowances">

            <label>Deductions (₹)</label>
            <input type="number" id="deduction" placeholder="Enter deductions">

            <div class="buttons">
                <button onclick="calculateSalary()">Calculate Salary</button>
                <button class="reset" onclick="resetForm()">Reset</button>
            </div>
        </div>

        <div class="result-section">
            <h2>Salary Summary</h2>

            <div class="employee">
                <p><strong>Name:</strong> <span id="showName">---</span></p>
                <p><strong>Employee ID:</strong> <span id="showId">---</span></p>
            </div>

            <div class="salary-box">
                <div>
                    <span>Basic Salary</span>
                    <strong id="showBasic">₹0</strong>
                </div>

                <div>
                    <span>HRA</span>
                    <strong id="showHra">₹0</strong>
                </div>

                <div>
                    <span>Allowances</span>
                    <strong id="showAllowance">₹0</strong>
                </div>

                <div>
                    <span>Total Deductions</span>
                    <strong id="showDeduction">₹0</strong>
                </div>
            </div>

            <div class="gross">
                <p>Gross Salary</p>
                <h2 id="grossSalary">₹0</h2>
            </div>

            <div class="net">
                <p>Net Salary</p>
                <h1 id="netSalary">₹0</h1>
            </div>

        </div>

    </div>

    <footer>
        <p>© 2026 Employee Salary Calculator | IBM BOB Project</p>
    </footer>

</div>

<script src="script.js"></script>

</body>
</html>
